[package]
name = "privacy-proof-benchmark-halo2"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "=1.0.100"
ff = "=0.14.0"
halo2_gadgets = { version = "=0.6.0", default-features = false }
halo2_poseidon = { version = "=0.2.0", default-features = false }
halo2_proofs = { version = "=0.4.0", default-features = true }
hex = "=0.4.3"
pasta_curves = "=0.6.0"
rand = "=0.10.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
