[package]
name = "shielded-consensus-halo2"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
default = []
worker = ["dep:libc"]
dev-prover = ["dep:rand", "dep:serde", "dep:serde_json"]

[dependencies]
ff = "=0.14.0"
halo2_gadgets = { version = "=0.6.0", default-features = false }
halo2_poseidon = { version = "=0.2.0", default-features = false }
halo2_proofs = { version = "=0.4.0", default-features = false }
hex = "=0.4.3"
libc = { version = "=0.2.189", optional = true }
pasta_curves = "=0.6.0"
rand = { version = "=0.10.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.145"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
[[bin]]
name = "shielded-profile-builder"
path = "src/bin/shielded-profile-builder.rs"
required-features = ["dev-prover"]

[[bin]]
name = "shielded-development-prover"
path = "src/bin/shielded-development-prover.rs"
required-features = ["dev-prover"]

[[bin]]
name = "shielded-development-client"
path = "src/bin/shielded-development-client.rs"
required-features = ["dev-prover"]

[[bin]]
name = "shielded-verifier-worker"
path = "src/bin/shielded-verifier-worker.rs"
required-features = ["worker"]

[[bin]]
name = "shielded-sandbox-probe"
path = "src/bin/shielded-sandbox-probe.rs"
required-features = ["worker"]
