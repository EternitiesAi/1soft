name: Pinned consensus engine preflight
on:
  push:
    paths:
      - '.github/workflows/engine-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Build the real pinned CometBFT engine without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          go version
          mkdir -p "$RUNNER_TEMP/1soft-bin"
          GOBIN="$RUNNER_TEMP/1soft-bin" go install github.com/cometbft/cometbft/cmd/cometbft@v0.38.25
          test "$("$RUNNER_TEMP/1soft-bin/cometbft" version)" = "0.38.25"
          "$RUNNER_TEMP/1soft-bin/cometbft" version
          sha256sum "$RUNNER_TEMP/1soft-bin/cometbft"
          go version -m "$RUNNER_TEMP/1soft-bin/cometbft"
          echo 'Engine build only. No native application or consensus-network test has run.'
